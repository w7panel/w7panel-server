# .cnb.yml
$:
  tag_push:
    - env:
        - IMAGE_REPOSITORY=ccr.ccs.tencentyun.com/afan-public/w7panel1
      imports:
        - https://cnb.cool/i0358/mykey/-/blob/main/218.yml
        - https://cnb.cool/i0358/mykey/-/blob/main/tencent.yml
      docker:
        # 通过此参数控制使用的 Dockerfile 构建镜像必须公开
        image: ccr.ccs.tencentyun.com/afan-public/ubuntu:go-build
        volumes:
          - /home/workspace/.cache:read-write
          - /root/.cache:read-write
      stages:
        - name: build-ui
          image: node:20
          if: 'case "$CNB_BRANCH" in 1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: |
            set -eu
            rm -rf /tmp/w7panel-ui
            git clone --depth 1 --branch dev-v1-k3k-crd https://github.com/w7panel/w7panel-ui /tmp/w7panel-ui
            cd /tmp/w7panel-ui
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            find "${CNB_BUILD_WORKSPACE}/kodata" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a dist/. "${CNB_BUILD_WORKSPACE}/kodata/"
        # - name: unzipwebdav
        #   script: cd ./kodata/plugin && unzip -o ./codeblitz.zip
        - name: logo
          if: 'case "$CNB_BRANCH" in 1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: mv ./kodata/logo.png ./kodata/assets/logo.png
        - name: login
          if: 'case "$CNB_BRANCH" in 1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: /root/go/bin/ko login ccr.ccs.tencentyun.com -u ${TENCENT_DOCKER_USERNAME} -p ${TENCENT_DOCKER_PASSWORD}
        # 构建镜像，并推送到镜像仓库
        - name: build
          if: 'case "$CNB_BRANCH" in 1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: export KO_DOCKER_REPO=ccr.ccs.tencentyun.com/afan-public/w7panel1 && export KO_DEFAULTBASEIMAGE=ccr.ccs.tencentyun.com/afan-public/ubuntu:24.04-offlineui && /root/go/bin/ko build --bare --tags=${CNB_BRANCH} --tag-only --sbom=none --platform=all
        # - name: publish
        #   script: echo $HELM_KUBECAFILE_BASE64 | base64 -d >/tmp/ca.crt && ./publish.sh

    # v开头使用测试镜像
    - env:
        - IMAGE_REPOSITORY=docker.cnb.cool/i0358/zpk
      imports:
        - https://cnb.cool/i0358/mykey/-/blob/main/218.yml
      docker:
        # 通过此参数控制使用的 Dockerfile 构建镜像必须公开
        image: ccr.ccs.tencentyun.com/afan-public/ubuntu:go-build
        volumes:
          - /home/workspace/.cache:read-write
          - /root/.cache:read-write
      stages:
        - name: build-ui
          image: node:20
          if: 'case "$CNB_BRANCH" in v1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: |
            set -eu
            rm -rf /tmp/w7panel-ui
            git clone --depth 1 --branch dev-v1-k3k-crd https://github.com/w7panel/w7panel-ui /tmp/w7panel-ui
            cd /tmp/w7panel-ui
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            find "${CNB_BUILD_WORKSPACE}/kodata" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a dist/. "${CNB_BUILD_WORKSPACE}/kodata/"
        # - name: unzipwebdav
        #   script: cd ./kodata/plugin && unzip -o ./codeblitz.zip
        - name: logo
          if: 'case "$CNB_BRANCH" in v1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: mv ./kodata/logo.png ./kodata/assets/logo.png
        - name: login
          if: 'case "$CNB_BRANCH" in v1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: /root/go/bin/ko login docker.cnb.cool -u cnb -p ${CNB_TOKEN}
        # - name: build-dev
        #   script: export KO_DOCKER_REPO=ccr.ccs.tencentyun.com/afan-public/w7panel-dev && export KO_DEFAULTBASEIMAGE=ccr.ccs.tencentyun.com/afan-public/ubuntu:24.04-offlineui && /root/go/bin/ko build --bare --tags=${CNB_BRANCH} --tag-only --sbom=none --platform=all
        # 构建镜像，并推送到镜像仓库
        - name: build
          if: 'case "$CNB_BRANCH" in v1.1.*) exit 0 ;; *) exit 1 ;; esac'
          script: export KO_DOCKER_REPO=docker.cnb.cool/i0358/zpk && export KO_DEFAULTBASEIMAGE=ccr.ccs.tencentyun.com/afan-public/ubuntu:24.04-offlineui && /root/go/bin/ko build --bare --tags=${CNB_BRANCH} --tag-only --sbom=none --platform=all
        # - name: publish
        #   script: echo $HELM_KUBECAFILE_BASE64 | base64 -d >/tmp/ca.crt && ./publish.sh

  vscode:
    - runner:
        cpus: 8
      docker:
        image: docker.cnb.cool/i0358/kbcli-helper:ide
      services:
        - vscode
        - docker
      stages:
        - name: ls
          script: ls -al
