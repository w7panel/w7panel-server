{{- $plugin := .Values.gatewayPlugin -}}
{{- $runtime := $plugin.runtime -}}
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: {{ .Release.Name }}
  namespace: higress-system
  annotations:
    higress.io/wasm-plugin-title: {{ .Values.app.title | quote }}
    higress.io/wasm-plugin-description: "higress 限流"
    w7.cc/plugin-enabled: "true"
    w7.cc/plugin-support-global: {{ $plugin.supportGlobal | quote }}
    w7.cc/plugin-support-rule: {{ $plugin.supportRule | quote }}
    {{ if $plugin.hasFrontend }}
    w7.cc/plugin-microapp: {{ .Release.Name | quote }}
    {{ end }}
  labels:
    w7.cc/group-name: {{ .Release.Name }}
    higress.io/wasm-plugin-name: "w7panel-pluginratelimit"
    higress.io/wasm-plugin-version: "1.0.1"
spec:
  url: {{ $runtime.url | quote }}
  phase: {{ $runtime.phase | quote }}
  priority: {{ $runtime.priority }}
  failStrategy: FAIL_OPEN
  defaultConfigDisable: {{ not $plugin.supportGlobal }}
  defaultConfig:
    {{ toYaml $plugin.defaultConfig | nindent 4 }}
  matchRules: []
