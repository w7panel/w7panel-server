{{- if .Values.childPanel.enabled }}
{{- $imageTag := required "childPanel.imageTag is required" .Values.childPanel.imageTag }}
{{- $imageRepository := required "childPanel.imageRepository is required" .Values.childPanel.imageRepository }}
{{- range .Values.childPanel.resources }}
{{- if eq .kind "DaemonSet" }}
{{- $annotations := .metadata.annotations | default dict }}
{{- $_ := set $annotations "helm-version" $imageTag }}
{{- $_ := set .metadata "annotations" $annotations }}
{{- range .spec.template.spec.initContainers }}
{{- $_ := set . "image" (printf "%s:%s" $imageRepository $imageTag) }}
{{- end }}
{{- range .spec.template.spec.containers }}
{{- $_ := set . "image" (printf "%s:%s" $imageRepository $imageTag) }}
{{- range .env }}
{{- if eq .name "HELM_VERSION" }}{{- $_ := set . "value" $imageTag }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
