                        properties:
                          key:
                            description: Key 是被引用的 ConfigMap 键名。
                            type: string
                          name:
                            description: Name 是被引用的 ConfigMap 名称。
                            type: string
                        type: object
                    type: object
                  registrationEnabled:
                    description: RegistrationEnabled 表示是否开启注册。
                    type: boolean
