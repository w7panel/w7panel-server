kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: microappsettings.w7panel.w7.com
spec:
  group: w7panel.w7.com
  names:
    kind: MicroAppSetting
    listKind: MicroAppSettingList
    plural: microappsettings
    singular: microappsetting
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec 是微应用站点设置的具体配置。
            properties:
              general:
                description: General 是通用站点设置。
                properties:
                  filing:
                    description: Filing 是备案相关设置。
                    properties:
                      electronicBusinessLicense:
                        description: ElectronicBusinessLicense 是电子执照信息。
                        type: string
                      icp:
                        description: ICP 是 ICP 备案信息。
                        type: string
                      publicSecurityNetworkFiling:
                        description: PublicSecurityNetworkFiling 是联网备案信息。
                        type: string
                      valueAddedTelecomBusinessLicense:
                        description: ValueAddedTelecomBusinessLicense 是增值电信业务经营许可证信息。
                        type: string
                    type: object
                  siteDescription:
                    description: SiteDescription 是站点描述。
                    type: string
                  siteLogo:
                    description: SiteLogo 是站点 LOGO 引用的 ConfigMap。
                    properties:
                      key:
                        description: Key 是被引用的 ConfigMap 键名。
                        type: string
                      name:
                        description: Name 是被引用的 ConfigMap 名称。
                        type: string
                    type: object
                  siteName:
                    description: SiteName 是站点名称。
                    type: string
                type: object
              login:
                description: Login 是登录设置。
                properties:
                  indexPage:
                    description: IndexPage 表示登录前默认首页。
                    type: string
                  loginMode:
                    description: LoginMode 表示登录方式。
                    type: string
                  protocolConfig:
                    description: ProtocolConfig 是注册协议与隐私协议配置。
                    properties:
                      privacyPolicy:
