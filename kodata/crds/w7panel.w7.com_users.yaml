---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.w7panel.w7.com
spec:
  group: w7panel.w7.com
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              passwordHash:
                type: string
              userMode:
                type: string
              role:
                type: string
              permissionName:
                type: string
              menuRules:
                type: array
                items:
                  type: string
              apiRules:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    method:
                      type: array
                      items:
                        type: string
              features:
                type: object
                properties:
                  debug:
                    type: boolean
                  webshell:
                    type: boolean
                  fileeditor:
                    type: boolean
              domainWhiteList:
                type: array
                items:
                  type: string
              expireTime:
                type: string
              demoUser:
                type: boolean
              consoleId:
                type: string
              consoleOpenid:
                type: string
              consoleNickname:
                type: string
              loginTime:
                type: string
              quotaLimit:
                x-kubernetes-preserve-unknown-fields: true
              quotaLimitLock:
                type: boolean
              costName:
                type: string
              cost:
                x-kubernetes-preserve-unknown-fields: true
              status:
                type: string
              clusterMode:
                type: string
              clusterStatus:
                type: string
              storageClass:
                type: string
              storageRequestSize:
                type: string
              pause:
                type: string
              jobName:
                type: string
              pendingRecycleTime:
                type: string
              cvmUser:
                type: boolean
              maintenance:
                type: boolean
              version:
                type: integer
                format: int32
            required:
            - userMode
