---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.w7panel.w7.com
spec:
  group: w7panel.w7.com
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              passwordHash:
                type: string
              userMode:
                type: string
              role:
                type: string
              permissionName:
                type: string
              menuRules:
                type: array
                items:
                  type: string
              apiRules:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    method:
                      type: array
                      items:
                        type: string
              features:
                type: object
                properties:
                  debug:
                    type: boolean
                  webshell:
                    type: boolean
                  fileeditor:
                    type: boolean
              domainWhiteList:
                type: array
                items:
                  type: string
              demoUser:
                type: boolean
              consoleId:
                type: string
              consoleOpenid:
                type: string
              consoleNickname:
                type: string
              w7Config:
                type: object
                properties:
                  thirdpartyCDToken:
                    type: string
                  cdTokenExpireTime:
                    type: integer
                  clusterId:
                    type: string
                  offlineUrl:
                    type: string
                  accessToken:
                    type: string
                  expireTime:
                    type: integer
                  apiServerUrl:
                    type: string
                  userInfo:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  license:
                    type: string
                  debugValue:
                    type: string
              loginTime:
                type: string
            required:
            - userMode
