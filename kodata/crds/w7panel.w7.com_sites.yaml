---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    api-approved.kubernetes.io: "https://www.w7.cc"
  name: sites.w7panel.w7.com
spec:
  group: w7panel.w7.com
  names:
    kind: Site
    listKind: SiteList
    plural: sites
    singular: site
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Site is the Schema for the ZPK site registration API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SiteSpec defines the desired state of a ZPK site.
            properties:
              appId:
                description: AppId is the registered App ID returned from the panel.
                type: string
              appSecret:
                description: AppSecret is the registered App Secret returned from the panel.
                type: string
              host:
                description: Host is the domain name of the site.
                type: string
              siteIdentifier:
                description: SiteIdentifier is the unique identifier for the site.
                type: string
              target:
                description: Target is the target Kubernetes resource to patch with the registered credentials.
                properties:
                  apiVersion:
                    description: APIVersion of the target resource (e.g. "apps/v1").
                    type: string
                  kind:
                    description: Kind of the target resource (e.g. "Deployment").
                    type: string
                  namespace:
                    description: Namespace of the target resource.
                    type: string
                  containerName:
                    description: ContainerName is the container in the target resource to inject env vars into.
                    type: string
                type: object
              userName:
                description: UserName is the user who owns or manages this site.
                type: string
            required:
            - host
            - siteIdentifier
            - target
            type: object
          status:
            description: SiteStatus defines the observed state of a ZPK site.
            properties:
              conditions:
                description: |-
                  Conditions represents the latest available observations of the
                  site's state.
                items:
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one
                        status to another. This should be when the underlying condition changed. If
                        that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastRegisteredAt:
                description: |-
                  LastRegisteredAt is the timestamp of the last successful
                  registration.
                format: date-time
                type: string
              message:
                description: Message provides additional status description.
                type: string
              phase:
                description: "Phase indicates the registration phase: Pending, Registered, or Failed."
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
