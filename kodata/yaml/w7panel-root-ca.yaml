apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: w7panel-root-ca
  namespace: cert-manager
spec:
  secretName: w7panel-root-ca-tls
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
  isCA: true
  commonName: w7panel-root-ca
  duration: 87600h
  renewBefore: 720h
  usages:
    - signing
    - key encipherment
    - cert sign
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: w7panel-root-ca-issuer
spec:
  ca:
    secretName: w7panel-root-ca-tls
