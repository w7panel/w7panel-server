kind: PersistentVolumeClaim
apiVersion: v1
metadata:
    name: default-volume
    namespace: default
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
    storageClassName: local-path
    volumeMode: Filesystem
status:
    phase: Bound
    accessModes:
        - ReadWriteOnce
    capacity:
        storage: 5Gi

---

kind: ConfigMap
apiVersion: v1
metadata:
    name: longhorn-volumes-config
    namespace: default
data:
    customs: default-volume
    default: default-volume

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
    name: default-admin
subjects:
    -
        kind: ServiceAccount
        name: default
        namespace: default
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: cluster-admin

---

kind: ConfigMap
apiVersion: v1
metadata:
    name: k3s.config
    namespace: kube-system
data:
    k3s.mode: '4'