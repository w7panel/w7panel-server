---
# 示例 1: 带 target（注册后自动注入 Deployment）
apiVersion: w7panel.w7.com/v1alpha1
kind: Site
metadata:
  name: my-site2
spec:
  host: site-test-a.fan.sz.w7.com
  siteIdentifier: my-site-001
  userName: admin
  target:
    apiVersion: apps/v1
    kind: Deployment
    name: test2-afrzsozs
    namespace: default
    containerName: my-container
---
# 示例 2: 仅注册，不 patch 任何资源
apiVersion: w7panel.w7.com/v1alpha1
kind: Site
metadata:
  name: my-site-register-only2
spec:
  host: site-test1-a.fan.sz.w7.com
  siteIdentifier: register-only-001
  userName: admin
---
# 示例 3: 写入 Secret（注册后将 APP_ID/APP_SECRET 写入 K8s Secret）
apiVersion: w7panel.w7.com/v1alpha1
kind: Site
metadata:
  name: my-site-secret
spec:
  host: site-test2-a.fan.sz.w7.com
  siteIdentifier: secret-001
  userName: admin
  target:
    kind: Secret
    name: my-site-creds
    namespace: default
---
# 示例 4: 写入 ConfigMap（注册后将 APP_ID/APP_SECRET 写入 K8s ConfigMap）
apiVersion: w7panel.w7.com/v1alpha1
kind: Site
metadata:
  name: my-site-cm
spec:
  host: site-test3-a.fan.sz.w7.com
  siteIdentifier: cm-001
  userName: admin
  target:
    kind: ConfigMap
    name: my-site-config
    namespace: default
---
# 示例 5: 写入 AppGroup CRD（注册后将 appId/appSecret 写入 AppGroup spec.appCredentials）
apiVersion: w7panel.w7.com/v1alpha1
kind: Site
metadata:
  name: my-site-appgroup
spec:
  host: site-test4-a.fan.sz.w7.com
  siteIdentifier: appgroup-001
  userName: admin
  target:
    apiVersion: w7panel.w7.com/v1alpha1
    kind: AppGroup
    name: afrzsozs
    namespace: default
