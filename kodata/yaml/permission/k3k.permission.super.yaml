    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - namespaces
    - serviceaccounts
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - w7panel.w7.com
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch
