  - path: /panel-api/v1/auth/console/oauth
    method: []
  - path: /panel-api/v1/auth/console/login
    method: []
  - path: /panel-api/v1/login
    method: []
  - path: /panel-api/v1/auth/login
    method: []
  - path: /panel-api/v1/auth/register
    method: []
  - path: /panel-api/v1/auth/console/code/*
    method:
    - '*'
  features:
    debug: true
    fileeditor: true
    webshell: true
  rbacRules:
  # Sensitive cluster and panel configuration is visible but immutable to administrators.
  - apiGroups:
    - apiextensions.k8s.io
    resources:
    - customresourcedefinitions
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - namespaces
    - serviceaccounts
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - w7panel.w7.com
    resources:
    - '*'
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - ''
    resources:
    - bindings
    - configmaps
    - endpoints
    - events
    - limitranges
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - pods/attach
    - pods/exec
    - pods/log
    - pods/portforward
    - pods/proxy
    - replicationcontrollers
    - replicationcontrollers/scale
    - resourcequotas
    - secrets
    - services
    - services/proxy
    verbs:
    - '*'
  - apiGroups:
    - apps
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - batch
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - networking.k8s.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - networking.higress.io
    - extensions.higress.io
    resources:
    - '*'
    verbs:
    - '*'
  - apiGroups:
    - autoscaling
    - policy
    - storage.k8s.io
    resources:
    - '*'
    verbs:
    - '*'
