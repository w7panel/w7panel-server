apiVersion: w7panel.w7.com/v1alpha1
kind: Permission
metadata:
    labels:
        typemode: in
    name: normal
spec:
    apiRules:
        -
            method:
                - get
            path: /panel-api/v1/app-info
        -
            method:
                - get
            path: /panel-api/v1/auth/console/info
        -
            method:
                - get
            path: /panel-api/v1/auth/userinfo
        -
            method:
                - get
            path: /panel-api/v1/k3k/info
        -
            method:
                - get
            path: /panel-api/v1/microapp/*/info
        -
            method:
                - delete
                - get
                - patch
                - create
                - update
            path: /panel-api/v1/microapp/*/proxy/*
        -
            method:
                - get
            path: /panel-api/v1/microapp/top
        -
            method:
                - get
            path: /panel-api/v1/static/*/status
    domainWhiteList: []
    features:
        debug: false
        fileeditor: false
        webshell: false
    menuRules: []
    parentPermission: ''
    role: normal
    title: 普通用户
    type: builtin
