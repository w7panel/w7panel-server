apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-ca
  namespace: cert-manager
spec:
  secretName: webhook-ca-tls
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
  isCA: true
  commonName: webhook-root-ca
  duration: 87600h
  renewBefore: 720h
  usages:
    - signing
    - key encipherment
    - cert sign
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: webhook-ca-issuer
spec:
  ca:
    secretName: webhook-ca-tls
